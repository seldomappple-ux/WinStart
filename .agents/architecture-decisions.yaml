decisions:
  - id: ADR-0001
    title: Deterministic adapter generation
    status: active
    summary: Adapter files are rendered by the Python CLI from structured sources. LLM output is never used as a translation layer.
  - id: ADR-0002
    title: Managed outputs stay read-only
    status: active
    summary: Durable policy changes must flow through .agents source files and the canonical rule catalog, not direct edits to generated adapters.
  - id: ADR-0003
    title: Sliding-window progress index
    status: active
    summary: PROGRESS.md only tracks current architecture decisions and the latest active entries, while older or upstreamed records stay searchable on disk.
  - id: ADR-WS-0001
    title: WinStart keeps a lightweight PySide6 desktop architecture
    status: active
    summary: The app remains a small Windows desktop launcher with `src/core` for state and launching logic and `src/ui` for the PySide6 interface.
  - id: ADR-WS-0002
    title: Existing project docs remain the user-facing primary docs
    status: active
    summary: Governance files support onboarding and AI alignment, while `README.md`, `USER_GUIDE.md`, and `RELEASE_NOTES.md` remain the main human-facing product docs.
